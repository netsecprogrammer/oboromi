name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64-system-qt
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-15
            artifact: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - name: Validate release source and version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases must be dispatched from the main branch'
          }
          if ($env:VERSION -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Version must use the exact vMAJOR.MINOR.PATCH format'
          }

          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq 'oboromi-core' })
          if ($package.Count -ne 1) {
            throw 'Could not identify exactly one oboromi-core package'
          }
          $expectedVersion = "v$($package[0].version)"
          if ($env:VERSION -ne $expectedVersion) {
            throw "Requested version $env:VERSION does not match core/Cargo.toml version $expectedVersion"
          }

          $tagLines = @(git ls-remote --tags origin "refs/tags/$env:VERSION" "refs/tags/$env:VERSION^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect existing tag $env:VERSION"
          }
          if ($tagLines.Count -gt 0) {
            $targetLine = $tagLines | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
            if ($null -eq $targetLine) {
              $targetLine = $tagLines[0]
            }
            $tagCommit = ($targetLine -split '\s+')[0]
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Existing tag $env:VERSION points to $tagCommit, not $env:GITHUB_SHA"
            }
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.10.3
          cache: true

      - name: Configure GUI
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI
        run: cmake --build build --config Release --parallel 4 --target oboromi-gui

      - name: Install application
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      - name: Verify installed application
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              test -f stage/bin/oboromi.exe
              ;;
            macOS)
              test -x stage/oboromi.app/Contents/MacOS/oboromi
              ;;
            Linux)
              test -x stage/bin/oboromi
              ;;
          esac

      - name: Package Unix application
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            printf '%s\n' \
              'This Linux archive is not self-contained.' \
              'It requires a Qt 6 Widgets runtime and system libraries compatible with the build host.' \
              'Build from source when those runtime requirements are unavailable.' \
              > stage/RUNTIME_REQUIREMENTS.txt
          fi
          cp license.txt README.md stage/
          tar -czf "oboromi-$VERSION-${{ matrix.artifact }}.tar.gz" -C stage .

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Copy-Item -Path license.txt, README.md -Destination stage
          Compress-Archive -Path stage\* -DestinationPath "oboromi-$env:VERSION-${{ matrix.artifact }}.zip"

      - name: Upload application artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: oboromi-${{ inputs.version }}-${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download application artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ inputs.version }}
          fail_on_unmatched_files: true
          files: artifacts/oboromi-*
