name: Rust CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-code-changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.filter.outputs.has_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "Pull-request base or head SHA is missing" >&2
            exit 1
          fi

          if git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" -- \
            ':!README.md' ':!license.txt' ':!docs/**' ':!.gitignore' | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.has_code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-14]
        rust: [stable]
        features: ["", "trace"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'

      - name: Setup Xcode on macOS
        if: startsWith(matrix.os, 'macos')
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Limit parallel jobs on macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          echo "CARGO_BUILD_JOBS=2" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C link-arg=-Wl,-no_pie" >> $GITHUB_ENV
          echo "Limiting parallelism to reduce memory usage"

      - name: Build project
        shell: bash
        run: |
          if [[ -z "${{ matrix.features }}" ]]; then
            cargo build --locked --jobs ${CARGO_BUILD_JOBS:-4}
          else
            cargo build --locked --jobs ${CARGO_BUILD_JOBS:-4} --features "${{ matrix.features }}"
          fi

      - name: Run test suite
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: |
          if [[ -z "${{ matrix.features }}" ]]; then
            cargo test --locked --verbose
          else
            cargo test --locked --verbose --features "${{ matrix.features }}"
          fi

      - name: Build parser fuzz targets
        if: matrix.os == 'ubuntu-latest' && matrix.features == ''
        env:
          CARGO_TARGET_DIR: target/fuzz
        run: cargo build --locked --manifest-path core/fuzz/Cargo.toml --bins

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [detect-code-changes, build]
    if: needs.detect-code-changes.outputs.has_code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly

      - name: Cache cargo binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-

      - name: Install tarpaulin if missing
        run: |
          if ! command -v cargo-tarpaulin &> /dev/null; then
            cargo install cargo-tarpaulin
          fi

      - name: Generate coverage report
        run: cargo tarpaulin --out Xml --output-dir target/coverage --release

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./target/coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          
  gui-build:
    name: Build Qt GUI (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.has_code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            installed_path: stage/bin/oboromi
          - os: windows-latest
            artifact: windows-x64
            installed_path: stage/bin/oboromi.exe
          - os: macos-15-intel
            artifact: macos-x64
            installed_path: stage/oboromi.app/Contents/MacOS/oboromi
          - os: macos-15
            artifact: macos-arm64
            installed_path: stage/oboromi.app/Contents/MacOS/oboromi

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.10.3
          cache: true

      - name: Configure GUI
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI
        run: cmake --build build --config Release --parallel 4 --target oboromi-gui

      - name: Install application
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      - name: Verify installed application
        shell: pwsh
        env:
          INSTALLED_APP: ${{ matrix.installed_path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:INSTALLED_APP -PathType Leaf)) {
            throw "Installed application not found at $env:INSTALLED_APP"
          }
